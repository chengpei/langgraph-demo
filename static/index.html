<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 对话</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1f2329;
    --text-muted: #8a9099;
    --border: #e5e7eb;
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --ai-bubble: #f0f2f5;
    --tool-bg: #fffbeb;
    --tool-border: #fcd34d;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191d;
      --panel: #22252a;
      --text: #e8eaed;
      --text-muted: #9aa0a8;
      --border: #353941;
      --user-bubble: #2f6fed;
      --ai-bubble: #2d3138;
      --tool-bg: #2a2415;
      --tool-border: #8a6d1d;
      --log-bg: #262a31;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100%;
    display: flex;
    justify-content: center;      /* 两侧留白：让主列居中 */
  }
  .app {
    width: 100%;
    max-width: 720px;             /* 对话列宽度，两侧自动留白 */
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.06);
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  .new-chat-btn {
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .new-chat-btn:hover { background: var(--ai-bubble); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
  }
  .msg-wrap { margin: 0 0 18px; display: flex; flex-direction: column; }
  .msg-wrap.user { align-items: flex-end; }
  .sender { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .ai .bubble { background: var(--ai-bubble); border-bottom-left-radius: 4px; }
  .bubble.empty::after {
    content: "▍";
    animation: blink 1s steps(2, start) infinite;
    color: var(--text-muted);
  }
  @keyframes blink { to { visibility: hidden; } }

  .tool-card {
    max-width: 85%;
    margin: 6px 0;
    padding: 8px 12px;
    font-size: 13px;
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-radius: 8px;
    color: var(--text);
    align-self: flex-start;
  }
  .tool-card .tool-name { font-weight: 600; }
  .tool-card .tool-result { color: var(--text-muted); margin-top: 2px; }
  /* 子 agent 的中间回复：弱化展示，明显区别于最终回复与工具结果 */
  .agent-log-card {
    max-width: 85%;
    margin: 6px 0;
    padding: 8px 12px;
    font-size: 12.5px;
    background: var(--log-bg, #eef2f7);
    border-left: 3px solid var(--border);
    border-radius: 4px;
    color: var(--text-muted);
    align-self: flex-start;
    /* 子 agent 回复可能很长，限高内部滚动，避免日志墙挤占主视口 */
    max-height: 180px;
    overflow-y: auto;
  }
  .agent-log-card .log-agent {
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 2px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .agent-log-card .log-content { white-space: pre-wrap; word-break: break-word; }
  .error-card {
    max-width: 85%;
    margin: 6px 0;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--danger);
    background: transparent;
    border: 1px solid var(--danger);
    border-radius: 8px;
  }

  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 16px 16px;
  }
  .input-row { margin: 0; display: flex; gap: 10px; }
  textarea {
    flex: 1;
    resize: none;
    max-height: 160px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  textarea:focus { border-color: var(--user-bubble); }
  #send-btn {
    align-self: flex-end;
    padding: 10px 20px;
    font-size: 14px;
    border: none;
    border-radius: 10px;
    background: var(--user-bubble);
    color: #fff;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { margin: 6px 0 0 0; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="app">

<header>
  <h1>AI 对话</h1>
  <button class="new-chat-btn" id="new-chat-btn">新对话</button>
</header>

<main id="chat"></main>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send-btn">发送</button>
  </div>
  <p class="hint">Enter 发送 / Shift+Enter 换行</p>
</footer>

</div>

<script>
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const newChatBtn = document.getElementById("new-chat-btn");

// 每个页面会话一个 thread_id，服务端 checkpointer 按此维护多轮上下文
let threadId = null;
let streaming = false;

function addMessage(role) {
  const wrap = document.createElement("div");
  wrap.className = `msg-wrap ${role}`;
  const sender = document.createElement("div");
  sender.className = "sender";
  sender.textContent = role === "user" ? "我" : "AI";
  const bubble = document.createElement("div");
  bubble.className = "bubble empty";
  wrap.append(sender, bubble);
  chatEl.appendChild(wrap);
  scrollToBottom();
  return bubble;
}

function addToolCard(name, result) {
  const card = document.createElement("div");
  card.className = "tool-card";
  const nameEl = document.createElement("div");
  nameEl.className = "tool-name";
  nameEl.textContent = `🔧 调用工具：${name}`;
  const resultEl = document.createElement("div");
  resultEl.className = "tool-result";
  resultEl.textContent = result;
  card.append(nameEl, resultEl);
  chatEl.appendChild(card);
  scrollToBottom();
  return card;
}

// 子 agent 的中间回复以日志形式弱化展示。按（agent + 消息 id）分组，
// 同一条 assistant 消息的多个 token 块累加进同一张日志卡。
let currentLog = { key: null, el: null };
function addAgentLog(agent, id, content) {
  const key = agent + "::" + (id || "");
  if (key !== currentLog.key) {
    const card = document.createElement("div");
    card.className = "agent-log-card";
    const tag = document.createElement("div");
    tag.className = "log-agent";
    tag.textContent = `@${agent}`;
    const body = document.createElement("div");
    body.className = "log-content";
    card.append(tag, body);
    chatEl.appendChild(card);
    currentLog.key = key;
    currentLog.el = body;
    scrollToBottom();
  }
  currentLog.el.textContent += content;
  scrollToBottom();
}

function addErrorCard(text) {
  const card = document.createElement("div");
  card.className = "error-card";
  card.textContent = `请求出错：${text}`;
  chatEl.appendChild(card);
  scrollToBottom();
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function autoResize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || streaming) return;

  streaming = true;
  sendBtn.disabled = true;
  inputEl.value = "";
  autoResize();

  const userBubble = addMessage("user");
  userBubble.textContent = text;
  userBubble.classList.remove("empty");

  const aiBubble = addMessage("ai");
  let aiText = "";

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, thread_id: threadId })
    });

    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE 事件以空行（\n\n）分隔
      const events = buffer.split("\n\n");
      buffer = events.pop();

      for (const evt of events) {
        const line = evt.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        const data = JSON.parse(line.slice(6));

        if (data.type === "token") {
          // 平时照常流式展示；若之后调用了工具，工具事件会把这段"前置话"清掉，
          // 从而保证最终回复只在工具完成后显示
          aiText += data.content;
          aiBubble.classList.remove("empty");
          aiBubble.textContent = aiText;
          scrollToBottom();
        } else if (data.type === "tool") {
          // 工具调用是中间进度：只加一张工具卡，不碰主回复气泡
          //（主回复仅由最终总结写入，避免被中途工具事件覆盖）
          addToolCard(data.name, data.content);
          scrollToBottom();
        } else if (data.type === "agent_log") {
          // 子 agent 的中间回复，作为日志弱化展示，不进入最终回复
          addAgentLog(data.agent, data.id, data.content);
        } else if (data.type === "done") {
          threadId = data.thread_id;
        } else if (data.type === "error") {
          addErrorCard(data.content);
        }
      }
    }
  } catch (e) {
    addErrorCard(e.message);
  } finally {
    aiBubble.classList.remove("empty");
    if (!aiText) aiBubble.remove();
    streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("input", autoResize);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
newChatBtn.addEventListener("click", () => {
  threadId = null;
  chatEl.innerHTML = "";
  currentLog = { key: null, el: null };
  inputEl.focus();
});

inputEl.focus();
</script>
</body>
</html>
